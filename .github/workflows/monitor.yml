name: Termin Monitor

on:
  schedule:
    - cron: '*/3 * * * *'   # 每 3 分钟触发一次单次检测
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 每次单次检测通常几分钟内完成，15 分钟足够

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests python-dotenv

      - name: Cache Playwright browsers # 👈 新增：缓存 Playwright 浏览器
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright Chromium
        # 如果缓存命中了，就跳过下载（但 --with-deps 的系统依赖每次都要装，较快）
        run: |
          python -m playwright install chromium --with-deps

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python test_background.py